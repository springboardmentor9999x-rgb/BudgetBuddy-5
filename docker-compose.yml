version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: budgetbuddy_db
    environment:
      POSTGRES_USER: budgetuser
      POSTGRES_PASSWORD: budgetpass
      POSTGRES_DB: budgetbuddydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetuser -d budgetbuddydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budgetbuddy_backend
    environment:
      DATABASE_URL: postgresql://budgetuser:budgetpass@db:5432/budgetbuddydb
      SECRET_KEY: budgetbuddy_production_secret_key_2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: budgetbuddy_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
